<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem E-Voting Pemilihan OSIS & MPK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <meta http-equiv="refresh" content="2;url=http://localhost:3000">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 rounded-3xl p-8 border border-slate-700 shadow-2xl text-center">
    <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-blue-600 flex items-center justify-center text-3xl shadow-lg shadow-blue-500/30">
      <i class="fa-solid fa-vote-yea"></i>
    </div>
    <h1 class="text-xl font-black mb-1">E-Voting OSIS &amp; MPK</h1>
    <p class="text-xs text-slate-400 mb-6">Aplikasi backend Express.js &amp; Prisma telah aktif dan berjalan di port 3000.</p>
    
    <div class="p-4 bg-slate-900/80 rounded-2xl border border-slate-700 mb-6 text-left text-xs space-y-2">
      <p class="font-bold text-slate-300">Tautan Akses Server:</p>
      <a href="http://localhost:3000" class="text-blue-400 hover:underline block truncate font-mono">
        &rarr; http://localhost:3000 (Portal Utama)
      </a>
      <a href="http://localhost:3000/pemilih/bilik" class="text-emerald-400 hover:underline block truncate font-mono">
        &rarr; http://localhost:3000/pemilih/bilik (Bilik Suara)
      </a>
      <a href="http://localhost:3000/live-count" class="text-rose-400 hover:underline block truncate font-mono">
        &rarr; http://localhost:3000/live-count (Quick Count)
      </a>
    </div>

    <a href="http://localhost:3000" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 font-bold text-xs rounded-xl shadow-lg transition block">
      Buka Aplikasi Sekarang &rarr;
    </a>
  </div>
</body>
</html>
